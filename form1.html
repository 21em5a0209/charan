<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
     <link rel="stylesheet" href="info.css">
</head>
<body>
    
    <h2>Registration Form</h2>
    <form style="text-align: center;" onsubmit="showSuccessPopup(event)">
        <div class="container">
        <label for="name">Name</label>
        <input type="text" name="name" required>
        <label for="email">Email</label>
        <input type="email" name="email" id="email" required>
        <label for="password">password</label>
        <input type="password" name="password" id="password" required>
        <label for="phone number">phone number</label>
        <input type="tel" name="phone number" id="phone number" required>
        <label for="gender">gender</label>
        <select id="gender">
            <option value="male" name="male">Male</option>
            <option value="female" name="female">Female</option>
            <option value="others" name="others">Other</option>
        </select>
        <label for="zipcode">zip code</label>
        <input type="text" name="zip code" id="zip code" required>
        <label for="about">About</label>
        <textarea name="about"></textarea>
        <div class="neha"></div>
        <input type="Submit" value="Register">
        </div>
    </form>

    <!-- Popup Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h1>✓ Success!</h1>
            <p>You have successfully registered!</p>
            <button onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        function showSuccessPopup(event) {
            event.preventDefault(); // Prevent form submission
            
            // Show the modal
            const modal = document.getElementById("successModal");
            modal.style.display = "block";
            
            // Reset the form
            event.target.reset();
        }

        function closeModal() {
            const modal = document.getElementById("successModal");
            modal.style.display = "none";
        }

        // Close modal when clicking the X button
        const closeBtn = document.querySelector(".close");
        closeBtn.onclick = function() {
            const modal = document.getElementById("successModal");
            modal.style.display = "none";
        }

        // Close modal when clicking outside of it
        window.onclick = function(event) {
            const modal = document.getElementById("successModal");
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
         
</body>
</html>
